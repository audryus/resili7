name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # 1. Run the full test suite before releasing
  # ──────────────────────────────────────────────
  test:
    runs-on: self-hosted
    name: Test before release
    container:
      image: node:20-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

  # ──────────────────────────────────────────────
  # 2. Create the GitHub Release with changelog
  # ──────────────────────────────────────────────
  release:
    runs-on: self-hosted
    name: Create Codeberg Release
    container:
      image: node:20-bookworm
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the changelog covers all commits

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Build a clean module cache so pkg.go.dev can index the module quickly
      - name: Verify module
        run: go mod verify

      # Generate a changelog from commits since the previous tag
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi
          # Write to a file to preserve newlines in the multiline output
          echo "$LOG" > changelog.txt
          echo "Changelog:"
          cat changelog.txt

      - name: Create GitHub Release
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: changelog.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # e.g. v1.0.0-beta.1

  # ──────────────────────────────────────────────
  # 3. Trigger pkg.go.dev indexing
  # ──────────────────────────────────────────────
  index:
    runs-on: self-hosted
    name: Trigger pkg.go.dev indexing
    container:
      image: node:20-bookworm
    needs: release

    steps:
      - name: Fetch module from proxy to trigger indexing
        run: |
          MODULE="codeberg.org/audryus/resili7"
          VERSION="${{ github.ref_name }}"
          curl -sSf "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info" || true
          curl -sSf "https://sum.golang.org/lookup/${MODULE}@${VERSION}" || true
