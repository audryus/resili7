name: Feature

on:
  push:
    branches:
      - "feat/**"

jobs:
  # ──────────────────────────────────────────────
  # Validate the feature branch
  # ──────────────────────────────────────────────
  test:
    runs-on: self-hosted
    name: Test
    container:
      image: node:20-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -count=1 -v -race -coverprofile=coverage.out ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...

      - name: Coverage summary
        if: always()
        run: |
          go tool cover -func=coverage.out | tail -n 1

  # ──────────────────────────────────────────────
  # Auto-PR: after tests pass, open/update a PR
  # to trunk with this branch's commit list
  # ──────────────────────────────────────────────
  auto-pr:
    runs-on: self-hosted
    name: Auto PR (feat -> trunk)
    container:
      image: node:20-bookworm
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create pull request to trunk
        env:
          TOKEN: ${{ secrets.TOKEN }}
          REPOSITORY: ${{ forgejo.repository }}
          BRANCH: ${{ forgejo.ref_name }}
        run: |
          API="${{ forgejo.api_url }}/repos/${REPOSITORY}/pulls"

          # Commits on this branch that are not on trunk yet
          git fetch origin trunk
          LOG=$(git log --reverse --pretty=format:"- %s" origin/trunk..HEAD)
          if [ -z "$LOG" ]; then
            echo "No new commits compared to trunk. Nothing to do."
            exit 0
          fi

          # Suggested title: subject of the first commit on the branch
          FIRST_SUBJECT=$(git log --reverse --pretty=format:"%s" origin/trunk..HEAD | head -n 1)
          TITLE="Auto PR [${BRANCH}]: ${FIRST_SUBJECT}"
          BODY=$(printf '## Auto-generated pipeline PR\n\n**Branch:** `%s` → `trunk`\n\n### Commits\n\n%s\n' "$BRANCH" "$LOG")

          # Dedup guard: skip if an open PR from this branch to trunk exists
          OPEN_PR=$(curl -sf \
            -H "Authorization: token ${TOKEN}" \
            "${API}?state=open&head=${REPOSITORY}:${BRANCH}&base=trunk" | jq length)
          if [ "${OPEN_PR}" != "0" ]; then
            echo "An open PR from ${BRANCH} to trunk already exists. Updating description..."
            PR_NUMBER=$(curl -sf \
              -H "Authorization: token ${TOKEN}" \
              "${API}?state=open&head=${REPOSITORY}:${BRANCH}&base=trunk" | jq -r '.[0].number')
            curl -sf -X PATCH \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"body\": $(jq -Rn --arg b "$BODY" '$b')}" \
              "${{ forgejo.api_url }}/repos/${REPOSITORY}/pulls/${PR_NUMBER}"
            exit 0
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg head "$BRANCH" \
            '{title: $title, body: $body, head: $head, base: "trunk"}' > /tmp/pr.json

          HTTP=$(curl -s -o /tmp/pr-response.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/pr.json \
            "$API")

          if [ "$HTTP" = "201" ]; then
            PR_URL=$(jq -r '.html_url' /tmp/pr-response.json)
            echo "PR created: ${PR_URL}"
          else
            echo "Failed to create PR (HTTP ${HTTP}):"
            cat /tmp/pr-response.json
            exit 1
          fi
