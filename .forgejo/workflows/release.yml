name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3)"
        required: true
        type: string

env:
  VERSION: ${{ forgejo.event.inputs.version }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Run the full test suite before releasing
  # ──────────────────────────────────────────────
  test:
    runs-on: self-hosted
    name: Test before release
    container:
      image: node:20-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: '$VERSION'. Expected format vX.Y.Z"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -count=1 -v -race ./...

  # ──────────────────────────────────────────────
  # 2. Create the tag and the Release with changelog
  # ──────────────────────────────────────────────
  release:
    runs-on: self-hosted
    name: Create Codeberg Release
    container:
      image: node:20-bookworm
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the changelog covers all commits

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Build a clean module cache so pkg.go.dev can index the module quickly
      - name: Verify module
        run: go mod verify

      # Create and push the tag on the tested commit
      - name: Create tag
        env:
          TOKEN: ${{ secrets.TOKEN }}
          REPOSITORY: ${{ forgejo.repository }}
        run: |
          git config user.name  "forgejo-ci"
          git config user.email "ci@codeberg.org"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

          git tag -a "$VERSION" -m "Release $VERSION (commit $(git rev-parse --short HEAD))"
          git push "https://oauth2:${TOKEN}@codeberg.org/${REPOSITORY}.git" "$VERSION"

      # Generate a changelog from commits since the previous tag
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${VERSION}")
          fi
          # Write to a file to preserve newlines in the multiline output
          echo "$LOG" > changelog.txt
          echo "Changelog:"
          cat changelog.txt

      - name: Create Release
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          body_path: changelog.txt
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}  # e.g. v1.0.0-beta.1

  # ──────────────────────────────────────────────
  # 3. Trigger pkg.go.dev indexing
  # ──────────────────────────────────────────────
  index:
    runs-on: self-hosted
    name: Trigger pkg.go.dev indexing
    container:
      image: node:20-bookworm
    needs: release

    steps:
      - name: Fetch module from proxy to trigger indexing
        run: |
          MODULE="codeberg.org/audryus/resili7"
          curl -sSf "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info" || true
          curl -sSf "https://sum.golang.org/lookup/${MODULE}@${VERSION}" || true
