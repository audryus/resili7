name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: gpu
    steps:
      - name: Dump forgejo context
        run: |
          cat <<EOF
          ${{ toJSON(forgejo) }}
          EOF

      - name: Debug Ollama
        env:
          OLLAMA_HOST: http://host.containers.internal:11434
        run: |
          set -x
          curl -v "$OLLAMA_HOST/api/tags"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          apt-get update && apt-get install -y curl jq git

      - name: Get PR diff
        id: diff
        run: |
          BASE_BRANCH="${{ forgejo.base_ref }}"

          echo "Base: $BASE_BRANCH"

          git fetch origin "$BASE_BRANCH"

          BASE_SHA=$(git merge-base "origin/$BASE_BRANCH" HEAD)

          git diff "$BASE_SHA...HEAD" > /tmp/diff.txt

          echo "Merge base: $BASE_SHA"
          
          cat /tmp/diff.txt
      - name: Run AI Review with Ollama
        env:
          OLLAMA_HOST: http://host.containers.internal:11434
        run: |
          MODEL="ornith:35b"
          
          PROMPT="Você é um revisor de código experiente. Analise o diff e liste:
          1. Bugs ou problemas de lógica
          2. Problemas de performance
          3. Vulnerabilidades de segurança
          4. Sugestões de melhoria de código

          Seja conciso e prático. Responda em português.

          DIFF:
          $(cat /tmp/diff.txt)"

          # Verificar se modelo existe
          RESP=$(curl -s "$OLLAMA_HOST/api/generate" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$MODEL\",
              \"prompt\": $(echo "$PROMPT" | jq -Rs .),
              \"stream\": false,
              \"options\": {
                \"temperature\": 0.2,
                \"num_ctx\": 8192
              }
            }")

          echo "===== OLLAMA RESPONSE ====="
          echo "$RESP" | jq .

          echo "$RESP" | jq -r '.response // empty' > /tmp/review.md

          echo "===== REVIEW ====="
          cat /tmp/review.md
      - name: Comment on PR via API
        env:
          TOKEN: ${{ secrets.TOKEN }}
          URL: ${{ forgejo.api_url }}
        run: |
          jq -Rs '{body: ("## 🤖 AI Code Review\n\n" + .)}' /tmp/review.md > /tmp/comment.json

          cat /tmp/comment.json

          curl --fail \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/comment.json \
            "$URL/repos/${{ forgejo.repository }}/issues/${{ forgejo.event.number }}/comments"