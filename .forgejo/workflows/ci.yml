name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

jobs:
  test:
    runs-on: gpu

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -count=1 -v -race -coverprofile=coverage.out ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          $(go env GOPATH)/bin/govulncheck ./...

      - name: Coverage summary
        if: always()
        run: |
          go tool cover -func=coverage.out | tail -n 1

      - name: Coverage threshold (60%)
        if: always()
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | grep -oE '[0-9]+\.[0-9]+%' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v cov="$total" 'BEGIN { if (cov + 0 < 60) { print "Coverage below 60% threshold"; exit 1 } }'
