name: Trunk

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  # ──────────────────────────────────────────────
  # Tag: manual dispatch with version input.
  # Validation is expected to have passed on the PR
  # (ci.yml gates the merge); this job only creates
  # the tag that triggers release.yml.
  # ──────────────────────────────────────────────
  tag:
    runs-on: self-hosted
    name: Create release tag
    container:
      image: node:20-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          TOKEN: ${{ secrets.TOKEN }}
          REPOSITORY: ${{ forgejo.repository }}
          VERSION: ${{ forgejo.event.inputs.version }}
        run: |
          git config user.name  "forgejo-ci"
          git config user.email "ci@codeberg.org"

          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: '$VERSION'. Expected format vX.Y.Z"
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

          git tag -a "$VERSION" -m "Release $VERSION (commit $(git rev-parse --short HEAD))"

          # Push the tag as the authenticated user (not the CI identity),
          # so Forgejo triggers the release workflow reliably.
          git push "https://$GITHUB_ACTOR:${TOKEN}@codeberg.org/${REPOSITORY}.git" "$VERSION"
          echo "Tag $VERSION pushed."
