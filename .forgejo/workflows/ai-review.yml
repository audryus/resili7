name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: gpu
    steps:
      - name: Dump forgejo context
        run: |
          cat <<EOF
          ${{ toJSON(forgejo) }}
          EOF
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          apt-get update && apt-get install -y curl jq git

      - name: Get PR diff
        id: diff
        run: |
          BASE_BRANCH="${{ github.base_ref }}"

          echo "Base: $BASE_BRANCH"

          git fetch origin "$BASE_BRANCH"

          BASE_SHA=$(git merge-base "origin/$BASE_BRANCH" HEAD)

          git diff "$BASE_SHA...HEAD" > /tmp/diff.txt

          echo "Merge base: $BASE_SHA"
      - name: Run AI Review with Ollama
        env:
          OLLAMA_HOST: http://host.containers.internal:11434
        run: |
          MODEL="ornith:35b"
          
          # Verificar se modelo existe
          curl -s "$OLLAMA_HOST/api/tags" | grep -q "$MODEL" || \
            (echo "Modelo $MODEL não encontrado. Execute: ollama pull $MODEL" && exit 1)
          
          PROMPT="Você é um revisor de código experiente. Analise o diff e liste:
          1. Bugs ou problemas de lógica
          2. Problemas de performance
          3. Vulnerabilidades de segurança
          4. Sugestões de melhoria de código

          Seja conciso e prático. Responda em português.

          DIFF:
          $(cat /tmp/diff.txt)"

          curl -s "$OLLAMA_HOST/api/generate" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$MODEL\",
              \"prompt\": $(echo "$PROMPT" | jq -Rs .),
              \"stream\": false,
              \"options\": {\"temperature\": 0.2, \"num_ctx\": 8192}
            }" | jq -r '.response' > /tmp/review.md

      - name: Comment on PR via API
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: |
          REVIEW=$(cat /tmp/review.md | jq -Rs .)
          
          curl -s -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"## 🤖 AI Code Review (Ollama + codellama)\n\n$REVIEW\"}" \
            "$FORGEJO_URL/api/v1/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments"