name: Trunk

on:
  push:
    branches: ["trunk"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  # ──────────────────────────────────────────────
  # Validate trunk
  # ──────────────────────────────────────────────
  test:
    runs-on: self-hosted
    name: Test
    container:
      image: node:20-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -count=1 -v -race -coverprofile=coverage.out ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...

      - name: Coverage summary
        if: always()
        run: |
          go tool cover -func=coverage.out | tail -n 1

  # ──────────────────────────────────────────────
  # Tag: only via manual dispatch with a version
  # input. The created tag triggers release.yml.
  # ──────────────────────────────────────────────
  tag:
    runs-on: self-hosted
    name: Create release tag
    container:
      image: node:20-bookworm
    needs: test
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          TOKEN: ${{ secrets.TOKEN }}
          REPOSITORY: ${{ forgejo.repository }}
          VERSION: ${{ forgejo.event.inputs.version }}
        run: |
          git config user.name  "forgejo-ci"
          git config user.email "ci@codeberg.org"

          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: '$VERSION'. Expected format vX.Y.Z"
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

          git tag -a "$VERSION" -m "Release $VERSION (commit $(git rev-parse --short HEAD))"
          git push "https://oauth2:${TOKEN}@codeberg.org/${REPOSITORY}.git" "$VERSION"
          echo "Tag $VERSION pushed. Release pipeline will pick it up."
