name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: gpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          apt-get update && apt-get install -y curl jq git

      - name: Get PR diff
        id: diff
        run: |
          BASE_BRANCH="${{ forgejo.base_ref }}"

          echo "Base: $BASE_BRANCH"

          git fetch origin "$BASE_BRANCH"

          BASE_SHA=$(git merge-base "origin/$BASE_BRANCH" HEAD)

          git diff "$BASE_SHA...HEAD" > /tmp/diff.txt

      - name: Run AI Review with Ollama
        env:
          OLLAMA_HOST: http://host.containers.internal:11434
        run: |
          MODEL="ornith:35b"
          cat > /tmp/system.txt <<'EOF'
          You are a Principal Software Engineer performing a professional code review.

          Your task is to review ONLY the provided git diff.

          Do not summarize the changes.
          Do not explain what the code does.
          Only report issues that are supported by the diff.

          Evaluate the code using the following criteria:

          ## Correctness
          - Logic errors
          - Bugs
          - Edge cases
          - Missing validation
          - Nil pointer risks
          - Error handling
          - Panic risks

          ## Concurrency
          - Race conditions
          - Deadlocks
          - Goroutine leaks
          - Context propagation
          - Channel misuse
          - Synchronization issues

          ## Performance
          - Unnecessary allocations
          - Algorithmic complexity
          - Memory usage
          - Lock contention
          - I/O inefficiencies

          ## Security
          - Injection vulnerabilities
          - Unsafe input handling
          - Sensitive data exposure
          - Authentication/authorization issues
          - Resource exhaustion

          ## API Design
          - Breaking changes
          - Public API consistency
          - Backward compatibility
          - Interface design

          ## Go Best Practices
          Evaluate according to:

          - Effective Go
          - Go Code Review Comments
          - Go Proverbs
          - Idiomatic Go
          - Standard library best practices

          Pay special attention to:

          - context.Context usage
          - error handling
          - interface design
          - package organization
          - simplicity
          - readability
          - maintainability
          - testability

          Ignore formatting and stylistic differences unless they negatively impact maintainability.

          Only report real problems.

          Do not invent hypothetical issues.

          If something is uncertain, do not report it.

          For every finding use exactly this format:

          ## <Severity> - <Short title>

          **File**
          path/to/file.go

          **Problem**
          Explain the issue.

          **Impact**
          Explain why this matters.

          **Recommendation**
          Explain how to fix it.

          Optionally include a small Go code snippet if it significantly improves the recommendation.

          Severity must be one of:

          - Critical
          - High
          - Medium
          - Low

          Order findings by severity.

          If there are no significant findings, output exactly:

          No significant issues found.

          Rules:

          - Do not suggest Next Steps.
          - Do not ask questions.
          - Do not expose your reasoning.
          - Do not include chain-of-thought.
          - Do not offer follow-up actions.
          - Do not congratulate the author.
          - Do not suggest improvements that are purely subjective.
          - Output Markdown only.
          EOF

          cat > /tmp/user.txt <<EOF
          Review the following git diff.

          Review ONLY the modified lines.

          Do not comment on unchanged code.

          Git diff:

          $(cat /tmp/diff.txt)
          EOF

          jq -n \
            --arg model "$MODEL" \
            --rawfile system /tmp/system.txt \
            --rawfile user /tmp/user.txt \
            '{
              model: $model,
              stream: false,
              messages: [
                {
                  role: "system",
                  content: $system
                },
                {
                  role: "user",
                  content: $user
                }
              ],
              options: {
                temperature: 0.2,
                num_ctx: 8192,
                num_predict: 4096
              }
            }' > /tmp/request.json

          RESP=$(curl -s "$OLLAMA_HOST/api/chat" \
              -H "Content-Type: application/json" \
              -d @/tmp/request.json)

          echo "===== OLLAMA RESPONSE ====="
          echo "$RESP" | jq .

          echo "$RESP" | jq -r '.message.content // empty' > /tmp/review.md

      - name: Comment on PR via API
        env:
          TOKEN: ${{ secrets.TOKEN }}
          URL: ${{ forgejo.api_url }}
        run: |
          jq -Rs '{body: ("## AI Code Review\n\n" + .)}' /tmp/review.md > /tmp/comment.json

          curl --fail \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/comment.json \
            "$URL/repos/${{ forgejo.repository }}/issues/${{ forgejo.event.number }}/comments"