name: Feature

on:
  push:
    branches:
      - "feat/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────
  # Auto-PR: open/update a PR to trunk with this
  # branch's commit list. Validation happens in CI
  # on the pull request itself.
  #
  # Uses secrets.TOKEN (a personal access token), NOT
  # GITHUB_TOKEN: PRs authored by github-actions[bot]
  # get stuck behind the "awaiting approval" gate and
  # don't retrigger checks. A PAT authors the PR as
  # you, so CI + AI review start automatically.
  # ──────────────────────────────────────────────
  auto-pr:
    runs-on: ubuntu-latest
    name: Auto PR (feat -> trunk)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update pull request to trunk
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GH_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret TOKEN (or GH_TOKEN): a personal access token with 'repo' scope."
            echo "Create one at GitHub → Settings → Developer settings → Personal access tokens,"
            echo "then add it at Repository → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

          git fetch origin trunk

          # Commits on this branch that are not on trunk yet
          LOG=$(git log --reverse --pretty=format:"- %s" origin/trunk..HEAD)
          if [ -z "$LOG" ]; then
            echo "No new commits compared to trunk. Nothing to do."
            exit 0
          fi

          # Suggested title: subject of the first commit on the branch
          FIRST_SUBJECT=$(git log --reverse --pretty=format:"%s" origin/trunk..HEAD | head -n 1)
          TITLE="Auto PR [${BRANCH}]: ${FIRST_SUBJECT}"
          BODY=$(printf '## Auto-generated pipeline PR\n\n**Branch:** `%s` → `trunk`\n\n### Commits\n\n%s\n' "$BRANCH" "$LOG")

          PR_NUMBER=$(gh pr list --head "$BRANCH" --base trunk --state open --json number --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "An open PR from ${BRANCH} to trunk already exists (#${PR_NUMBER}). Updating title and body..."
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          else
            if ! OUT=$(gh pr create --base trunk --head "$BRANCH" --title "$TITLE" --body "$BODY" 2>&1); then
              echo "$OUT"
              if echo "$OUT" | grep -q "not permitted to create or approve pull requests"; then
                echo ""
                echo "REMEDIATION: the repository blocks GitHub Actions from opening PRs."
                echo "  Repository → Settings → Actions → General → Workflow permissions"
                echo "  → check 'Allow GitHub Actions to create and approve pull requests' → Save,"
                echo "  then re-run this job."
              fi
              exit 1
            fi
            echo "$OUT"
          fi
