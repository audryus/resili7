name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: gpu          
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y curl jq git

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr_diff.txt
          # Limitar tamanho do diff para não explodir o contexto
          head -c 50000 /tmp/pr_diff.txt > /tmp/pr_diff_truncated.txt

      - name: Run AI Review with Ollama
        env:
          OLLAMA_HOST: http://host.docker.internal:11434
        run: |
          MODEL="ornith:35b"  # ou llama3, mistral, qwen2.5-coder, etc.
          
          # Verificar se modelo está disponível
          curl -s "$OLLAMA_HOST/api/tags" | grep -q "$MODEL" || \
            (echo "Modelo $MODEL não encontrado. Instale com: ollama pull $MODEL" && exit 1)
          
          # Preparar prompt
          PROMPT="Você é um revisor de código experiente. Analise o seguinte diff e forneça:
          1. Bugs ou problemas de lógica
          2. Sugestões de melhoria de performance
          3. Problemas de segurança
          4. Questões de estilo/maintainability
          
          Seja conciso e prático. Responda em português.
          
          DIFF:
          $(cat /tmp/pr_diff_truncated.txt)"
          
          # Chamar Ollama
          REVIEW=$(curl -s "$OLLAMA_HOST/api/generate" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$MODEL\",
              \"prompt\": $(echo "$PROMPT" | jq -Rs .),
              \"stream\": false,
              \"options\": {
                \"temperature\": 0.3,
                \"num_ctx\": 8192
              }
            }" | jq -r '.response')
          
          echo "$REVIEW" > /tmp/ai_review.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/ai_review.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## AI Code Review\n\n${review}`
            });